<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bot Trade - Suivi</title>
<style>
  body { margin:0; font-family:Segoe UI,sans-serif; background:#0f1117; color:#e6e6e6; padding:24px; }
  h1 { margin:0 0 20px; font-size:22px; }
  h2 { font-size:16px; color:#8b90a0; margin:28px 0 12px; font-weight:normal; }
  a { color:#6ea8fe; }
  .cards { display:flex; gap:16px; margin-bottom:8px; }
  .card { flex:1; background:#1a1d27; border-radius:10px; padding:16px; }
  .card small { color:#8b90a0; }
  .card .val { font-size:26px; margin-top:6px; }
  .green { color:#3ddc84; } .red { color:#ff5c5c; }
  table { width:100%; border-collapse:collapse; background:#1a1d27; border-radius:10px; }
  th, td { padding:12px; text-align:left; border-bottom:1px solid #2a2e3d; }
  th { color:#8b90a0; font-weight:normal; }
  .chart { display:flex; align-items:flex-end; gap:10px; height:160px; background:#1a1d27; border-radius:10px; padding:16px; }
  .bar { flex:1; text-align:center; font-size:11px; color:#8b90a0; display:flex; flex-direction:column; justify-content:flex-end; height:100%; }
  .bar div { border-radius:4px 4px 0 0; margin-bottom:6px; }
</style>
</head>
<body>
  <h1>Suivi</h1>
  <a href="index.html">← Retour au dashboard</a>

  <h2>Statistiques</h2>
  <div class="cards">
    <div class="card"><small>PnL total</small><div class="val" id="pnl"></div></div>
    <div class="card"><small>Win rate</small><div class="val" id="win"></div></div>
    <div class="card"><small>Trades</small><div class="val" id="nb"></div></div>
    <div class="card"><small>Meilleur trade</small><div class="val green" id="best"></div></div>
    <div class="card"><small>Pire trade</small><div class="val red" id="worst"></div></div>
  </div>

  <h2>PnL par jour</h2>
  <div class="chart" id="chart"></div>

  <h2>Positions ouvertes</h2>
  <table>
    <thead><tr><th>Token</th><th>Entrée</th><th>Mise</th><th>PnL actuel</th></tr></thead>
    <tbody id="open"></tbody>
  </table>

  <h2>Historique des trades</h2>
  <table>
    <thead><tr><th>Date</th><th>Token</th><th>Wallet copié</th><th>PnL</th></tr></thead>
    <tbody id="history"></tbody>
  </table>

<script>
  // Fausses données pour l'instant
  const trades = [
    { date: '25/11 09:12', token: 'MOONX',  wallet: '7xKXtg...osgAsU', pnl: 1.20 },
    { date: '25/11 08:47', token: 'WIFCAT', wallet: '9WzDXw...YtAWWM', pnl: -0.12 },
    { date: '24/11 22:30', token: 'BONKY',  wallet: '7xKXtg...osgAsU', pnl: 0.45 },
    { date: '24/11 18:05', token: 'DOGX',   wallet: 'DYw8jC...CNSKK',  pnl: -0.30 },
    { date: '23/11 14:20', token: 'SOLCAT', wallet: '9WzDXw...YtAWWM', pnl: 0.60 }
  ];
  const openPos = [
    { token: 'ZAPPY', entry: '25/11 10:02', stake: 0.10, pnl: 0.08 },
    { token: 'GLITCH', entry: '25/11 10:20', stake: 0.10, pnl: -0.03 }
  ];
  const days = [
    { label: '23/11', pnl: 0.60 },
    { label: '24/11', pnl: 0.15 },
    { label: '25/11', pnl: 1.08 }
  ];

  const fmt = n => (n >= 0 ? '+' : '') + n.toFixed(2) + ' SOL';
  const cls = n => n >= 0 ? 'green' : 'red';

  const total = trades.reduce((s, t) => s + t.pnl, 0);
  const wins = trades.filter(t => t.pnl > 0).length;
  const pnls = trades.map(t => t.pnl);

  const pnlEl = document.getElementById('pnl');
  pnlEl.textContent = fmt(total);
  pnlEl.className = 'val ' + cls(total);
  document.getElementById('win').textContent = Math.round(wins / trades.length * 100) + '%';
  document.getElementById('nb').textContent = trades.length;
  document.getElementById('best').textContent = fmt(Math.max(...pnls));
  document.getElementById('worst').textContent = fmt(Math.min(...pnls));

  const maxAbs = Math.max(...days.map(d => Math.abs(d.pnl)));
  document.getElementById('chart').innerHTML = days.map(d => {
    const h = Math.max(4, Math.abs(d.pnl) / maxAbs * 100);
    const color = d.pnl >= 0 ? '#3ddc84' : '#ff5c5c';
    return `<div class="bar"><div style="height:${h}px;background:${color}"></div>${d.label}<br>${fmt(d.pnl)}</div>`;
  }).join('');

  document.getElementById('open').innerHTML = openPos.map(p => `<tr>
    <td>${p.token}</td><td>${p.entry}</td><td>${p.stake.toFixed(2)} SOL</td>
    <td class="${cls(p.pnl)}">${fmt(p.pnl)}</td></tr>`).join('');

  document.getElementById('history').innerHTML = trades.map(t => `<tr>
    <td>${t.date}</td><td>${t.token}</td><td>${t.wallet}</td>
    <td class="${cls(t.pnl)}">${fmt(t.pnl)}</td></tr>`).join('');
</script>
<script src="nav.js"></script>
</body>
</html>
