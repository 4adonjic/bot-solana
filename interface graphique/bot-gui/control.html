<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bot Trade - Contrôle</title>
<style>
  body { margin:0; font-family:Segoe UI,sans-serif; background:#0f1117; color:#e6e6e6; padding:24px; }
  h1 { margin:0 0 20px; font-size:22px; }
  h2 { font-size:16px; color:#8b90a0; margin:28px 0 12px; font-weight:normal; }
  a { color:#6ea8fe; }
  .cards { display:flex; gap:16px; }
  .card { flex:1; background:#1a1d27; border-radius:10px; padding:16px; }
  .card small { color:#8b90a0; }
  .card .val { font-size:20px; margin-top:6px; }
  .green { color:#3ddc84; } .red { color:#ff5c5c; } .orange { color:#ffb84d; }
  .btns { display:flex; gap:12px; }
  button { padding:14px 24px; border:none; border-radius:8px; color:white; cursor:pointer; font-size:15px; }
  #start { background:#2e9e5b; }
  #stop { background:#4a4f63; }
  #kill { background:#d63c3c; margin-left:auto; }
  #logs { background:#0a0c10; border:1px solid #2a2e3d; border-radius:10px; padding:12px; height:300px; overflow-y:auto; font-family:Consolas,monospace; font-size:13px; }
  .l-info { color:#8b90a0; } .l-ok { color:#3ddc84; } .l-warn { color:#ffb84d; } .l-err { color:#ff5c5c; }
</style>
</head>
<body>
  <h1>Contrôle</h1>
  <a href="index.html">← Retour au dashboard</a>

  <h2>Statut</h2>
  <div class="cards">
    <div class="card"><small>Bot</small><div class="val red" id="status">Arrêté</div></div>
    <div class="card"><small>Mode</small><div class="val" id="mode">-</div></div>
    <div class="card"><small>Connexion RPC</small><div class="val green" id="rpc">OK (simulé)</div></div>
    <div class="card"><small>Solde du wallet du bot</small><div class="val">0.00 SOL</div></div>
  </div>

  <h2>Actions</h2>
  <div class="btns">
    <button id="start" onclick="startBot()">▶ Démarrer</button>
    <button id="stop" onclick="stopBot()">■ Arrêter</button>
    <button id="kill" onclick="killSwitch()">⚠ KILL-SWITCH</button>
  </div>

  <h2>Logs en direct</h2>
  <div id="logs"></div>

<script>
  // Mode lu depuis les paramètres
  let settings = {};
  try { settings = JSON.parse(localStorage.getItem('settings') || '{}'); } catch (e) {}
  document.getElementById('mode').textContent = settings.mode === 'reel' ? 'Réel' : 'Simulation';

  const logsEl = document.getElementById('logs');
  const statusEl = document.getElementById('status');
  let running = false;
  let timer = null;

  function log(msg, type) {
    const t = new Date().toLocaleTimeString('fr-FR');
    logsEl.innerHTML += `<div class="l-${type}">[${t}] ${msg}</div>`;
    logsEl.scrollTop = logsEl.scrollHeight;
  }

  // Faux messages pour l'instant
  const fake = [
    ['Nouveau token détecté : ZAPPY', 'info'],
    ['ZAPPY : score sécurité 84/100, validé', 'ok'],
    ['Wallet suivi a acheté GLITCH', 'info'],
    ['GLITCH : score 41/100, rejeté', 'warn'],
    ['Erreur RPC -32015, nouvelle tentative', 'err'],
    ['Position ouverte : ZAPPY (0.10 SOL)', 'ok']
  ];

  function startBot() {
    if (running) return;
    running = true;
    statusEl.textContent = 'En marche';
    statusEl.className = 'val green';
    log('Bot démarré', 'ok');
    timer = setInterval(() => {
      const m = fake[Math.floor(Math.random() * fake.length)];
      log(m[0], m[1]);
    }, 2000);
  }

  function stopBot() {
    if (!running) return;
    running = false;
    clearInterval(timer);
    statusEl.textContent = 'Arrêté';
    statusEl.className = 'val red';
    log('Bot arrêté', 'warn');
  }

  function killSwitch() {
    clearInterval(timer);
    running = false;
    statusEl.textContent = 'KILL-SWITCH';
    statusEl.className = 'val orange';
    log('KILL-SWITCH activé : arrêt immédiat, positions à fermer', 'err');
  }
</script>
<script src="nav.js"></script>
</body>
</html>
