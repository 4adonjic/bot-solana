<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bot Trade - Wallets</title>
<style>
  body { margin:0; font-family:Segoe UI,sans-serif; background:#0f1117; color:#e6e6e6; padding:24px; }
  h1 { margin:0 0 20px; font-size:22px; }
  h2 { font-size:16px; color:#8b90a0; margin:28px 0 12px; font-weight:normal; }
  a { color:#6ea8fe; }
  .bar { display:flex; gap:10px; }
  input { flex:1; padding:12px; background:#1a1d27; border:1px solid #2a2e3d; border-radius:8px; color:#e6e6e6; font-size:14px; }
  button { padding:12px 20px; background:#3d6bff; border:none; border-radius:8px; color:white; cursor:pointer; font-size:14px; }
  .err { color:#ff5c5c; margin-top:8px; font-size:13px; }
  table { width:100%; border-collapse:collapse; background:#1a1d27; border-radius:10px; }
  th, td { padding:12px; text-align:left; border-bottom:1px solid #2a2e3d; }
  th { color:#8b90a0; font-weight:normal; }
  .green { color:#3ddc84; } .red { color:#ff5c5c; }
  .del { background:#2a2e3d; padding:6px 12px; font-size:12px; }
</style>
</head>
<body>
  <h1>Wallets</h1>
  <a href="index.html">← Retour au dashboard</a>

  <h2>Cibler un wallet</h2>
  <div class="bar">
    <input id="addr" placeholder="Colle une adresse de wallet Solana">
    <button onclick="addTarget()">Ajouter</button>
  </div>
  <div class="err" id="err"></div>

  <h2>Mes wallets ciblés</h2>
  <table>
    <thead><tr><th>Adresse</th><th></th></tr></thead>
    <tbody id="targets"></tbody>
  </table>

  <h2>Wallets repérés par le bot</h2>
  <table>
    <thead><tr><th>Adresse</th><th>Win rate</th><th>PnL 30j</th><th>Trades</th></tr></thead>
    <tbody id="found"></tbody>
  </table>

<script>
  // Fausses données pour l'instant
  const found = [
    { addr: '7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU', win: 72, pnl: 14.2, trades: 88 },
    { addr: '9WzDXwBbmkg8ZTbNMqUxvQRAyrZzDsGYdLVL9zYtAWWM', win: 65, pnl: 6.8, trades: 41 },
    { addr: 'DYw8jCTfwHNRJhhmFcbXvVDTqWMEVFBX6ZKUmG5CNSKK', win: 48, pnl: -2.1, trades: 120 }
  ];

  let targets = [];
  try { targets = JSON.parse(localStorage.getItem('targets') || '[]'); } catch (e) {}

  function save() {
    try { localStorage.setItem('targets', JSON.stringify(targets)); } catch (e) {}
  }

  function short(a) { return a.slice(0, 6) + '...' + a.slice(-6); }

  function render() {
    document.getElementById('targets').innerHTML = targets.length
      ? targets.map((a, i) => `<tr><td title="${a}">${short(a)}</td>
          <td><button class="del" onclick="removeTarget(${i})">Retirer</button></td></tr>`).join('')
      : '<tr><td colspan="2">Aucun wallet ciblé</td></tr>';

    document.getElementById('found').innerHTML = found.map(w => `<tr>
      <td title="${w.addr}">${short(w.addr)}</td>
      <td>${w.win}%</td>
      <td class="${w.pnl >= 0 ? 'green' : 'red'}">${w.pnl >= 0 ? '+' : ''}${w.pnl} SOL</td>
      <td>${w.trades}</td></tr>`).join('');
  }

  function addTarget() {
    const input = document.getElementById('addr');
    const err = document.getElementById('err');
    const a = input.value.trim();
    err.textContent = '';
    if (!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a)) { err.textContent = 'Adresse Solana invalide'; return; }
    if (targets.includes(a)) { err.textContent = 'Déjà dans la liste'; return; }
    targets.push(a);
    save();
    input.value = '';
    render();
  }

  function removeTarget(i) {
    targets.splice(i, 1);
    save();
    render();
  }

  render();
</script>
<script src="nav.js"></script>
</body>
</html>
