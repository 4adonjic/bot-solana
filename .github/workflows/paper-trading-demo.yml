name: Paper Trading Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-demo:
    name: Run synthetic paper trading scenario
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run paper trading demo
        run: npm run demo:paper
