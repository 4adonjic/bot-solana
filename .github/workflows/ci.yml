name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/radar-websocket]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Decoder unit tests
        run: npm test
      - name: GUI data adapter tests
        run: node --test 'interface graphique/bot-gui/dashboard-data.test.cjs'
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
