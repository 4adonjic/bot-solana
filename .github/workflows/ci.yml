name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/radar-websocket]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install bot dependencies
        run: npm ci
      - name: Decoder unit tests
        run: npm test
      - name: Install GUI dependencies
        working-directory: interface graphique/bot-gui
        run: npm install
      - name: GUI data adapter tests
        working-directory: interface graphique/bot-gui
        run: npm test
      - name: GUI TypeScript and Vite build
        working-directory: interface graphique/bot-gui
        run: npm run build:web
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build bot
        run: npm run build
